<meta charset="utf-8">
<!-- Direction E: the frozen design, D plus the accent rework (2026-11-14).
     Everything structural and typographic is D's and is unchanged: two-row header,
     full-width segmented control, bare readout columns, 1px rules, symmetric last row,
     radius 0/8/12, system sans only, 30px semibold tabular numerals.
     What changed, and only this:
       1. The single accent is a quiet violet, not Kimi blue. Each theme gets its own
          lightness ladder because one value cannot clear 3:1 on both papers.
       2. The active cell is ringed with that accent instead of the neutral hairline —
          a fill difference alone measured 1.14 light / 1.33 dark against the track, under
          WCAG 1.4.11's 3:1 for a state indicator. The accent ring measures 4.46 / 4.82.
          This lives in --seg-ring, so the settings window's control uses it too: one
          token, one look, no second way to say "selected".
       3. The Update chip is a tag (radius 4) and its light fill is 18% of the accent,
          not 10%: at 10% it lifted only 1.12 off the paper and read as no fill at all,
          while the dark one lifted 1.24.
     Sample figures are data, not style, but they follow the panel's formatters: money
     always carries two decimals since 2026-11-14 (`Granted ¥10.00`, `¥100.00`, PLAN §5.2),
     so a comparison against this file does not mistake the old whole-yuan rule for a
     rendering bug.
     Why 264deg / 28%: the user's own palette (previously #B3A3CC at 72% lightness).
     Its hue and chroma were right; only the lightness ladder had to be split per theme. -->
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quota Tray — panel demo E (frozen design)</title>
<style>
:root[data-theme='light'] {
  color-scheme: light;
  --stage: #e7e7e4;
  --paper: #fbfaf9;
  --ink-1: #000000e6;
  --ink-2: #00000099;
  --ink-3: #0000004d;
  --hair: #00000021;
  --hair-soft: #00000012;
  --accent: #8c74b1;
  --accent-bar: #7d61a6;
  --accent-ink: #6c5293;
  --tint: #8c74b12e;
  --seg-track: #f1f0ec;
  --seg-on: #ffffff;
  --seg-ring: #7d61a6;
  --danger: #b42318;
  --shadow: 0 12px 40px #00000026;
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --stage: #0f0f12;
  --paper: #181817;
  --ink-1: #ffffffd6;
  --ink-2: #ffffff8f;
  --ink-3: #ffffff42;
  --hair: #ffffff1f;
  --hair-soft: #ffffff12;
  --accent: #9d88bc;
  --accent-bar: #9d88bc;
  --accent-ink: #b5abc4;
  --tint: #9d88bc26;
  --seg-track: #262624;
  --seg-on: #3a3a37;
  --seg-ring: #9d88bc;
  --danger: #ff6b6b;
  --shadow: 0 12px 40px #00000073;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  font-family: 'Segoe UI', system-ui, -apple-system, 'PingFang SC',
    'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
body { background: var(--stage); color: var(--ink-1); }

.stage { width: 424px; padding: 28px; }
.panel {
  width: 368px;
  background: var(--paper);
  border: 1px solid var(--hair);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* ---------- header: sans wordmark + full-width segmented pill ---------- */
.hdr { padding: 12px 14px 0; }
.hdr-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.brand { font-size: 13px; font-weight: 500; color: var(--ink-1); }
.stamp { font-size: 11px; font-weight: 400; color: var(--ink-2); }
.stamp.bad { color: var(--danger); }

.seg {
  display: flex;
  gap: 2px;
  margin: 10px 0 12px;
  padding: 3px;
  background: var(--seg-track);
  border-radius: 12px;
}
.seg button {
  flex: 1;
  height: 30px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-2);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 400;
  cursor: pointer;
  transition: background-color 150ms ease, color 150ms ease;
}
.seg button:hover { color: var(--ink-1); }
.seg button[aria-selected='true'] {
  background: var(--seg-on);
  color: var(--ink-1);
  font-weight: 500;
  box-shadow: inset 0 0 0 1px var(--seg-ring);
}

/* ---------- Kimi: two bare readout columns ---------- */
.pane { padding: 0 14px; }
.quota { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 10px; }
.field {
  padding: 10px 0 11px;
}
.label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-2);
  line-height: 1.2;
}
.num {
  display: flex;
  align-items: baseline;
  gap: 2px;
  margin-top: 6px;
}
.num b { font-size: 30px; font-weight: 600; line-height: 1.05; letter-spacing: -.01em; }
.num .unit { font-size: 15px; font-weight: 500; color: var(--ink-2); }
.num.is-danger b, .num.is-danger .unit { color: var(--danger); } /* only the DeepSeek balance uses this now */

.bar { height: 4px; border-radius: 2px; background: var(--hair-soft); margin-top: 9px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 2px; background: var(--accent-bar); transition: width 200ms ease; }
.bar.share { height: 3px; margin-top: 8px; }
.note {
  margin-top: 7px;
  font-size: 10.5px;
  color: var(--ink-2);
}

/* ---------- rows: 1px warm rules, no containers ---------- */
.row { border-top: 1px solid var(--hair); padding: 9px 0; }
.pane > .row:last-child { padding-bottom: 10px; }
.row-main { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.row-label { font-size: 12px; font-weight: 400; color: var(--ink-2); }
.row-value {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-1);
}
.row-value.muted { font-weight: 500; color: var(--ink-2); }
.row-value.word {
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
}
.row-side { display: flex; align-items: center; gap: 6px; }

.badge {
  font-size: 9.5px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--accent-ink);
  background: var(--tint);
  border-radius: 4px;
  padding: 2px 8px;
}

.extra-meta { margin-top: 8px; }
.extra-note {
  margin-top: 6px;
  font-size: 10.5px;
  color: var(--ink-2);
}

/* ---------- DeepSeek ---------- */
.balance { padding: 2px 0 10px; }
.status { font-size: 11px; font-weight: 400; color: var(--ink-2); }
.status.bad { color: var(--danger); }

.mrows { border-top: 1px solid var(--hair); }
.mrow { padding: 9px 0; border-bottom: 1px solid var(--hair); }
.mrow:last-child { border-bottom: 0; }
.mrow-main { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.mname { font-size: 12.5px; font-weight: 500; color: var(--ink-1); }
.mcost {
  font-size: 15px;
  font-weight: 600;
}
.meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-top: 7px;
  font-size: 10.5px;
  color: var(--ink-2);
}
.hit.is-bad { color: var(--danger); }

.total {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  border-top: 1px solid var(--hair);
  padding: 8px 0 10px;
  font-size: 10.5px;
  color: var(--ink-2);
}

.hint {
  border-top: 1px solid var(--hair);
  padding: 10px 0 10px;
  font-size: 11px;
  line-height: 1.5;
  color: var(--ink-2);
}
.hint.bad { color: var(--danger); }

/* ---------- footer ---------- */
.actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
  border-top: 1px solid var(--hair);
  padding: 5px;
}
.act {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: 42px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--ink-2);
  font-family: inherit;
  font-size: 10.5px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 150ms ease, color 150ms ease;
}
.act:hover { background: var(--seg-track); color: var(--ink-1); }
.act svg { width: 16px; height: 16px; display: block; fill: currentColor; }

:focus-visible { outline: 2px solid var(--accent-bar); outline-offset: 2px; }

/* ---------- demo-only chrome ---------- */
.bar-ui {
  position: fixed; left: 0; bottom: 0; right: 0;
  display: none; flex-wrap: wrap; gap: 14px; align-items: center;
  padding: 10px 14px;
  background: #141413f2; color: #faf9f5;
  font: 12px/1.4 'Segoe UI', system-ui, sans-serif;
  border-top: 1px solid #ffffff1f;
}
body:not(.bare) .bar-ui { display: flex; }
body:not(.bare) .stage { padding-bottom: 96px; }
.bar-ui .grp { display: flex; align-items: center; gap: 6px; }
.bar-ui .lbl { color: #87867f; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
.bar-ui button {
  font: inherit; color: #faf9f5; background: #ffffff14;
  border: 1px solid #ffffff1f; border-radius: 8px; padding: 4px 9px; cursor: pointer;
}
.bar-ui button[aria-pressed='true'] { background: #8c74b1; border-color: #8c74b1; color: #fff; }
.bar-ui .measure { margin-left: auto; color: #87867f; font-variant-numeric: tabular-nums; }
.bar-ui .measure b { color: #faf9f5; font-weight: 600; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<div class="stage">
  <div class="panel" id="panel">

      </div>

        <button role="tab" id="tab-kimi" aria-selected="true" aria-controls="pane-kimi" data-tab="kimi">Kimi</button>
        <button role="tab" id="tab-ds" aria-selected="false" aria-controls="pane-ds" data-tab="ds" tabindex="-1">DeepSeek</button>
      </div>

    <section class="pane" id="pane-kimi" role="tabpanel" aria-labelledby="tab-kimi">

    <section class="pane" id="pane-ds" role="tabpanel" aria-labelledby="tab-ds" hidden>

          <span class="label">Balance</span>
          <span class="status" id="d-status">Available</span>

      </div>
      <div class="mrows" id="d-models"></div>
      <div class="total" id="d-total-row">
        <span id="d-sum">This month ¥3.00 · 2.45M tok</span>
        <span id="d-sum-today">today ¥0.30</span>
      </div>
    </section>

      </button>
      <button class="act" id="act-exit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2.5h2a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1ZM8.02 6.07A8 8 0 1 0 15.98 6.07l-1.5 1.73A6 6 0 1 1 9.52 7.8Z"></path></svg>
        <span>Exit</span>
      </button>
    </footer>
  </div>
</div>

<div class="bar-ui" id="ui">
  <div class="grp"><span class="lbl">Theme</span>
    <button data-theme-set="system">System</button>
    <button data-theme-set="light">Light</button>
    <button data-theme-set="dark">Dark</button>
  </div>
  <div class="grp"><span class="lbl">State</span>
    <button data-state="normal">Normal</button>
    <button data-state="four">4 models</button>
    <button data-state="hot">High usage</button>
    <button data-state="err">Errors</button>
    <button data-state="nocred">Not configured</button>
  </div>
  <div class="measure">card <b id="m-card">--</b> · window <b id="m-win">--</b></div>
</div>

<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const root = document.documentElement;
  const panel = document.getElementById('panel');
  const stamp = document.getElementById('stamp');
  const mCard = document.getElementById('m-card');
  const mWin = document.getElementById('m-win');
  const modelsEl = document.getElementById('d-models');
  const extraMeta = document.getElementById('k-extra-meta');
  const badge = document.getElementById('k-badge');

  const state = {
    tab: qs.get('tab') === 'ds' ? 'ds' : 'kimi',
    theme: qs.get('theme') || 'system',
    variant: qs.get('state') || 'normal',
  };
  if (qs.get('bare') === '1') document.body.classList.add('bare');

  const mq = matchMedia('(prefers-color-scheme: dark)');
  function applyTheme() {
    root.dataset.theme = state.theme === 'system' ? (mq.matches ? 'dark' : 'light') : state.theme;
  }

  const MODELS = {
    normal: [
      { name: 'V4 Pro', cost: '¥2.50', pct: 100, tokens: '1.33M tok', hit: 80, today: 'today ¥0.30' },
      { name: 'V4 Flash', cost: '¥0.50', pct: 84, tokens: '1.12M tok', hit: 50, today: 'today ¥0.00' },
    ],
    four: [
      { name: 'V4 Pro', cost: '¥2.50', pct: 100, tokens: '1.33M tok', hit: 80, today: 'today ¥0.30' },
      { name: 'V4 Flash', cost: '¥0.50', pct: 84, tokens: '1.12M tok', hit: 50, today: 'today ¥0.00' },
      { name: 'V3.2', cost: '¥0.32', pct: 21, tokens: '284K tok', hit: 91, today: 'today ¥0.02' },
      { name: 'DeepSeek Chat', cost: '¥0.08', pct: 7, tokens: '96K tok', hit: 62, today: 'today ¥0.00' },
    ],
  };

  // Cache-hit colouring is two-state on purpose: the case gives us one functional
  // red and no amber, so "healthy" stays uncoloured and only <60% is called out.
  function hitClass(v) { return v < 60 ? 'hit is-bad' : 'hit'; }

  function renderModels(list) {
    modelsEl.innerHTML = list.map((m) => `
      <div class="mrow">
        <div class="mrow-main"><span class="mname">${m.name}</span><span class="mcost">${m.cost}</span></div>
        <div class="bar share"><i style="width:${m.pct}%"></i></div>
        <div class="meta"><span>${m.tokens} · <span class="${hitClass(m.hit)}">cache ${m.hit}%</span></span><span>${m.today}</span></div>
      </div>`).join('');
  }

  const KIMI = {
    normal: { week: 12, five: 31, extra: 'No data', meta: false, version: '0.39.1', badge: true, stamp: 'Updated 18:14', bad: false },
    four:   { week: 12, five: 31, extra: 'No data', meta: false, version: '0.39.1', badge: true, stamp: 'Updated 18:14', bad: false },
    hot:    { week: 86, five: 94, extra: '¥8.20', meta: true, limitPct: 92, note: '¥92.00 of ¥100.00 this month', version: '0.39.1', badge: true, stamp: 'Updated 18:14', bad: false },
    err:    { week: 12, five: 31, extra: 'No data', meta: false, version: '0.39.1', badge: false, stamp: 'Fetch failed', bad: true },
    nocred: { week: null, five: null, extra: 'Not activated', meta: false, version: 'Not detected', badge: false, stamp: 'No token', bad: true },
  };

  const DS = {
    normal: { balance: '¥66.50', status: ['Available', 'ok'], detail: 'Granted ¥10.00 · Topped up ¥56.50', sum: 'This month ¥3.00 · 2.45M tok', today: 'today ¥0.30', models: 'normal', hint: '' },
    four:   { balance: '¥66.50', status: ['Available', 'ok'], detail: 'Granted ¥10.00 · Topped up ¥56.50', sum: 'This month ¥3.40 · 2.83M tok', today: 'today ¥0.32', models: 'four', hint: '' },
    hot:    { balance: '¥6.40', status: ['Insufficient balance', 'bad'], detail: 'Granted ¥0.00 · Topped up ¥56.40', sum: 'This month ¥3.00 · 2.45M tok', today: 'today ¥0.30', models: 'normal', hint: '' },
    err:    { balance: '¥66.50', status: ['Available', 'ok'], detail: 'Granted ¥10.00 · Topped up ¥56.50', sum: '', today: '', models: null, hint: 'Usage token expired — open Settings and sign in again to sync.' },
    nocred: { balance: '--', status: ['Not configured', 'bad'], detail: 'API key not set', sum: '', today: '', models: null, hint: 'Open Settings to add your DeepSeek API key and usage token.' },
  };

  function render() {
    applyTheme();
    document.querySelectorAll('.seg button').forEach((b) => {
      const on = b.dataset.tab === state.tab;
      b.setAttribute('aria-selected', String(on));
      b.tabIndex = on ? 0 : -1;
    });
    document.getElementById('pane-kimi').hidden = state.tab !== 'kimi';
    document.getElementById('pane-ds').hidden = state.tab !== 'ds';

    const k = KIMI[state.variant] || KIMI.normal;
    const setPct = (id, barId, v) => {
      const el = document.getElementById(id);
      document.getElementById(barId).style.width = v == null ? '0%' : v + '%';
      el.textContent = v == null ? '--' : String(v);
    };
    setPct('k-week', 'k-week-bar', k.week);
    setPct('k-five', 'k-five-bar', k.five);
    document.getElementById('k-week-reset').textContent = k.week == null ? '' : 'Resets in 2d 18h';
    document.getElementById('k-five-reset').textContent = k.five == null ? '' : 'Resets in 3h 33m';
    const extraEl = document.getElementById('k-extra');
    extraEl.textContent = k.extra;
    const isMoney = k.extra !== 'No data' && k.extra !== 'Not activated';
    extraEl.classList.toggle('muted', !isMoney);
    extraEl.classList.toggle('word', !isMoney);
    extraMeta.hidden = !k.meta;
    if (k.meta) {
      document.getElementById('k-extra-bar').style.width = k.limitPct + '%';
      document.getElementById('k-extra-note').textContent = k.note;
    }
    document.getElementById('k-version').textContent = k.version;
    badge.hidden = !k.badge;
    stamp.textContent = k.stamp;
    stamp.classList.toggle('bad', k.bad);

    const d = DS[state.variant] || DS.normal;
    const total = document.getElementById('d-total');
    total.textContent = d.balance;
    total.parentElement.classList.toggle('is-danger', d.status[1] === 'bad');
    const st = document.getElementById('d-status');
    st.textContent = d.status[0];
    st.className = 'status ' + d.status[1];
    document.getElementById('d-detail').textContent = d.detail;
    const totalRow = document.getElementById('d-total-row');
    if (d.models) {
      renderModels(MODELS[d.models]);
      modelsEl.className = 'mrows';
      totalRow.hidden = false;
      document.getElementById('d-sum').textContent = d.sum;
      document.getElementById('d-sum-today').textContent = d.today;
    } else {
      modelsEl.className = 'hint' + (state.variant === 'err' ? ' bad' : '');
      modelsEl.textContent = d.hint;
      totalRow.hidden = true;
    }

    const h = panel.offsetHeight;
    mCard.textContent = h + 'px';
    mWin.textContent = h + 56 + 'px';
  }

  document.querySelectorAll('.seg button').forEach((btn) => {
    btn.addEventListener('click', () => { state.tab = btn.dataset.tab; render(); });
  });
  document.querySelectorAll('[data-theme-set]').forEach((b) => {
    b.addEventListener('click', () => {
      state.theme = b.dataset.themeSet;
      document.querySelectorAll('[data-theme-set]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      render();
    });
  });
  document.querySelectorAll('[data-state]').forEach((b) => {
    b.addEventListener('click', () => {
      state.variant = b.dataset.state;
      document.querySelectorAll('[data-state]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      render();
    });
  });
  mq.addEventListener('change', () => { if (state.theme === 'system') render(); });

  document.querySelector(`[data-theme-set="${state.theme}"]`)?.setAttribute('aria-pressed', 'true');
  document.querySelector(`[data-state="${state.variant}"]`)?.setAttribute('aria-pressed', 'true');
  render();
})();
</script>
</body>
</html>
