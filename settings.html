<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quota Tray Settings</title>
  </head>
  <body>
    <div id="root">
      <!-- Title bar: wordmark + close, whole row draggable -->
      <div class="hdr" id="titlebar">
        <div class="hdr-top">
          <span class="brand">Quota Tray Settings</span>
          <button class="chrome-close" id="btn-close" title="Close">&#10005;</button>
        </div>
      </div>

      <div class="pane">
        <!-- General (PLAN §4): the three persisted preferences -->
        <div class="label">Theme</div>
        <div class="seg" role="radiogroup" aria-label="Theme">
          <label>
            <input type="radio" name="theme" value="system" />
            <span class="seg-item">System</span>
          </label>
          <label>
            <input type="radio" name="theme" value="light" />
            <span class="seg-item">Light</span>
          </label>
          <label>
            <input type="radio" name="theme" value="dark" />
            <span class="seg-item">Dark</span>
          </label>
        </div>

        <div class="label section-gap">Refresh interval</div>
        <div class="seg" role="radiogroup" aria-label="Refresh interval">
          <label>
            <input type="radio" name="interval" value="1" />
            <span class="seg-item">1 min</span>
          </label>
          <label>
            <input type="radio" name="interval" value="5" />
            <span class="seg-item">5 min</span>
          </label>
          <label>
            <input type="radio" name="interval" value="10" />
            <span class="seg-item">10 min</span>
          </label>
          <label>
            <input type="radio" name="interval" value="30" />
            <span class="seg-item">30 min</span>
          </label>
        </div>

        <label class="switch-row">
          <span class="row-label">Launch at Windows startup</span>
          <input type="checkbox" id="autostart" role="switch" />
          <span class="switch" aria-hidden="true"></span>
        </label>

        <!-- Kimi: read-only (PLAN §4). No value of the token ever reaches here. -->
        <div class="sect">
          <div class="label">Kimi</div>
          <div class="row">
            <div class="row-main">
              <span class="row-label">CLI version</span>
              <span class="row-value muted" id="kimi-version">--</span>
            </div>
          </div>
          <div class="row">
            <div class="row-main">
              <span class="row-label">Credential</span>
              <span class="row-value muted" id="kimi-credential">--</span>
            </div>
          </div>
        </div>

        <!-- DeepSeek: statuses + sign-in + the manual fallback (PLAN §4). -->
        <div class="sect">
          <div class="label">DeepSeek</div>
          <div class="row">
            <div class="row-main">
              <span class="row-label">API key</span>
              <span class="row-value muted" id="ds-api-key">--</span>
            </div>
          </div>
          <div class="row">
            <div class="row-main">
              <span class="row-label">Usage token</span>
              <span class="row-value muted" id="ds-user-token">--</span>
            </div>
          </div>
          <div class="actions">
            <button class="btn" id="btn-sign-in">Sign in…</button>
            <button class="btn" id="btn-clear">Clear</button>
          </div>
          <div class="note" id="ds-note" hidden></div>

          <details class="more" id="manual">
            <summary>Paste a credential instead</summary>
            <label class="cred-field">
              <span class="row-label">API key</span>
              <input
                type="password"
                id="in-api-key"
                autocomplete="off"
                spellcheck="false"
                placeholder="Verified before it is saved"
              />
            </label>
            <label class="cred-field">
              <span class="row-label">Usage token</span>
              <input
                type="password"
                id="in-user-token"
                autocomplete="off"
                spellcheck="false"
                placeholder="JSON.parse(localStorage.userToken).value"
              />
            </label>
            <div class="note" id="cred-note" hidden></div>
            <button class="btn" id="btn-save-cred">Save credentials</button>
          </details>
        </div>

        <button class="btn save" id="btn-save">Save settings</button>
      </div>
    </div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
