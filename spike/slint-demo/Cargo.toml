[package]
name = "slint-demo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "slint-demo"
path = "src/main.rs"

[dependencies]
# Both renderers ship in the demo so the comparison can switch at run time:
# `--renderer wgpu|gl|skia` -> SLINT_BACKEND. Skia pulls skia-bindings, which
# downloads a prebuilt archive on first build (needs github.com reachable; a full
# source build would need LLVM/clang). femtovg-wgpu is pure Rust and honours
# window transparency since Slint 1.17.
slint = { version = "1.18", features = ["renderer-femtovg-wgpu", "renderer-skia"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
