<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kimi Skills</title>
  </head>
  <body>
    <div id="root">
      <!-- Title bar: wordmark + close, whole row draggable -->
      <div class="hdr" id="titlebar">
        <div class="hdr-top">
          <span class="brand">Kimi Skills</span>
          <button class="chrome-close" id="btn-close" title="Close">&#10005;</button>
        </div>
      </div>

      <div class="pane">
        <div class="summary">
          <span class="label" id="summary-text">Loading…</span>
          <button class="link-btn" id="btn-refresh" title="Rescan skills">Refresh</button>
        </div>
        <div class="list" id="list"></div>
      </div>
    </div>
    <script type="module" src="/src/skills.ts"></script>
  </body>
</html>
